[project]
name = "make-sense"
version = "0.1.0"
description = "Converts research paper PDFs into structured, beginner-friendly explainer documents using LLMs."
readme = "README.md"
authors = [
    { name = "mohith", email = "mohith.work@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "logging-tree>=1.10",
    "marker-pdf>=2.0.0",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
make-sense = "make_sense:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
